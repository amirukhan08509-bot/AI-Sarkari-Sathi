name: sarkari_sathi
description: "AI sarkari sathi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  http: ^1.2.2
  dio: ^5.9.0
  firebase_core: ^4.13.0
  provider: ^6.1.5
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3
  lottie: ^3.3.2
  cached_network_image: ^3.4.1
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/sathi.png
    - assets/images/app_icon.png
    - assets/json/schemes.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"